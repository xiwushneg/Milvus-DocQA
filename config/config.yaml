# ============ 文档检索问答系统 全局配置 ============
# 三种部署模式的组合方式见 README.md「三种部署模式」

milvus:
  # Milvus Standalone（docker-compose 启动后使用，Windows 推荐）：
  uri: "http://localhost:19530"
  # Milvus Lite（仅 macOS/Linux，本地文件即数据库）：
  # uri: "./data/milvus_docqa.db"
  collection: "docqa_chunks"
  dense_dim: 1024          # BAAI/bge-m3=1024；BAAI/bge-large-zh-v1.5=1024；mock 测试用 256
  index_metric: "COSINE"

embedding:
  # local : 本地 sentence-transformers（首次运行下载权重，较慢）
  # api   : OpenAI 兼容 /embeddings 接口（如 SiliconFlow 托管 bge-m3，无需 GPU）
  # mock  : 确定性哈希向量（仅用于单元/冒烟测试）
  provider: "api"
  model: "BAAI/bge-m3"
  api_base: "https://api.siliconflow.cn/v1"
  api_key_env: "EMBEDDING_API_KEY"   # 从该环境变量读取密钥
  batch_size: 32
  device: "cpu"            # 有 GPU 可改 "cuda"

chunking:
  chunk_size: 500          # 目标块大小（字符）
  chunk_overlap: 80        # 相邻块重叠（字符），约为 chunk_size 的 15%
  min_chunk_size: 30       # 过短块并入前一块

llm:
  # OpenAI 兼容协议，三选一：
  #   SiliconFlow:  base_url: https://api.siliconflow.cn/v1        model: Qwen/Qwen2.5-7B-Instruct
  #   Ollama 本地:  base_url: http://localhost:11434/v1            model: qwen2.5:7b
  #   vLLM 本地:    base_url: http://localhost:8001/v1             model: Qwen/Qwen2.5-7B-Instruct
  base_url: "https://api.siliconflow.cn/v1"
  model: "deepseek-ai/DeepSeek-V3.2"
  api_key_env: "LLM_API_KEY"
  temperature: 0.1
  max_tokens: 1024
  # 前端可切换的模型档案（cloud = 上面主配置；其余档案覆盖 base_url/model，密钥与温度继承）
  profiles:
    ft:
      label: "本机微调 Qwen3-1.7B"
      base_url: "http://127.0.0.1:8009/v1"
      model: "qwen3-docqa-ft"

retrieval:
  dense_top_k: 20          # 稠密向量召回数
  bm25_top_k: 20           # BM25 关键词召回数
  rrf_k: 60                # RRF 融合常数（经典取值 60）
  final_top_k: 5           # 送入大模型的最终上下文块数
  rerank:
    enabled: false         # 重排序（可选增强，开启后对融合结果精排）
    mode: "api"            # api | local
    model: "BAAI/bge-reranker-v2-m3"
    api_base: "https://api.siliconflow.cn/v1"
    api_key_env: "EMBEDDING_API_KEY"
